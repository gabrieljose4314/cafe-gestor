<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./img/logo-192.png">
    <link rel="apple-touch-icon" href="./img/logo-192.png">
    <meta name="theme-color" content="#2d4a2b">
    <title>Gerenciamento de Vendas</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="vendas.js?v=1.6"></script>
    <script type="module" src="menu.js?v=1.5"></script>
</head>
<body>
    <header>
        <nav>
            <h1>Painel de Gestão de Café</h1>
            <hr>
            <h2 class="titulo">Gerenciamento de Vendas</h2>
        </nav>
    </header>
    <section class="menu">
        <details>
            <summary>
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
                </svg>
            </summary>
            <ul>
                <li><a href="index.html">Painel de Gestão</a></li>
                <li><a href="moitas.html">Gerenciamento de Moitas</a></li>
                <li><a href="despesas.html">Gerenciamento de Despesas</a></li>
                <li><a href="companheiros.html">Gerenciamento de Companheiros</a></li>
                <li><a href="colheita.html">Gerenciamento de Colheita</a></li>
                <li><a href="historico.html">Histórico de Movimentações</a></li>
            </ul>
        </details>
    </section>

    <main>
        <section>
            <div class="acoes-principais">
                <button class="btn-acao" onclick="abrirModal('modal-venda')">💰 Registrar Venda</button>
                <button class="btn-acao marrom" onclick="abrirModal('modal-ver-vendas')">📋 Ver Vendas Registradas</button>
            </div>
        </section>
    </main>

    <!-- MODAL: REGISTRAR VENDA -->
    <div class="modal-overlay" id="modal-venda">
        <div class="modal-box">
            <button class="modal-fechar" onclick="fecharModal('modal-venda')">✕</button>
            <h3>💰 Registrar Venda</h3>
            <form id="gerenciamento-vendas-form">
                <label for="moita-vendas">Moita:</label>
                <select id="moita-vendas" name="moita-vendas">
                    <option value="">Sem moita específica</option>
                </select><br><br>
                <label for="data-venda">Data da Venda:</label>
                <input type="date" id="data-venda" name="data-venda" required><br><br>
                <label for="quantidade-vendida">Quantidade Vendida (sacas):</label>
                <input type="number" id="quantidade-vendida" name="quantidade-vendida" step="0.01" required><br><br>
                <label for="preco-unitario">Preço por Saca (R$):</label>
                <input type="number" id="preco-unitario" name="preco-unitario" step="0.01" required><br><br>
                <button type="submit">Registrar Venda</button>
            </form>
        </div>
    </div>

    <!-- MODAL: VER VENDAS REGISTRADAS -->
    <div class="modal-overlay" id="modal-ver-vendas">
        <div class="modal-box">
            <button class="modal-fechar" onclick="fecharModal('modal-ver-vendas')">✕</button>
            <h3>📋 Vendas Registradas</h3>
            <input type="text" id="pesquisa-venda" class="campo-busca" placeholder="Pesquisar por moita" oninput="filtrarVendas()">
            <div id="lista-vendas"></div>
        </div>
    </div>
</body>
</html>
